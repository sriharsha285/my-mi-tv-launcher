<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi TV Pro Leanback Launcher</title>
<style>
  :root {
    --accent: #e50914;
    --accent-glow: rgba(229, 9, 20, 0.55);
    --bg-base: #07080c;
    --glass: rgba(20, 22, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: var(--bg-base);
    color: #ffffff;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  /* FULL-BLEED DYNAMIC FANART BACKDROP */
  .fanart-container {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .fanart-img {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center 20%;
    transition: background-image 0.6s ease-in-out, transform 0.8s ease;
    transform: scale(1.03);
  }
  .fanart-vignette {
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(90deg, #07080c 0%, rgba(7,8,12,0.88) 38%, rgba(7,8,12,0.25) 100%),
      linear-gradient(0deg, #07080c 0%, rgba(7,8,12,0.92) 32%, rgba(7,8,12,0.15) 75%, rgba(7,8,12,0.7) 100%);
  }

  /* MAIN LAYOUT */
  .ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 36px 56px;
  }

  /* TOP NAVIGATION BAR */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
  }
  .brand-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .nav-pills {
    display: flex;
    gap: 10px;
    background: var(--glass);
    padding: 6px 10px;
    border-radius: 40px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
  }
  .nav-tab {
    background: transparent;
    border: 2px solid transparent;
    color: #a1a1aa;
    font-size: 16px;
    font-weight: 600;
    padding: 8px 24px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .nav-tab.active-tab {
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
  }
  .nav-tab.focused {
    color: #fff;
    border-color: #fff;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
    transform: scale(1.06);
  }
  .top-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .saver-trigger {
    background: var(--glass);
    border: 2px solid var(--glass-border);
    color: #e4e4e7;
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .saver-trigger.focused {
    border-color: #fff;
    background: #2563eb;
    transform: scale(1.08);
  }
  .clock {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* HERO STAGE (TOP SHELF SPOTLIGHT) */
  .hero-stage {
    max-width: 650px;
    margin-top: 10px;
    margin-bottom: auto;
    padding-top: 18px;
    transition: opacity 0.25s ease;
  }
  .hero-badge-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .badge-pill {
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .badge-meta {
    font-size: 14px;
    font-weight: 600;
    color: #d4d4d8;
  }
  .hero-title {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.08;
    margin-bottom: 10px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .hero-desc {
    font-size: 16px;
    color: #d4d4d8;
    line-height: 1.45;
    margin-bottom: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-actions {
    display: flex;
    gap: 14px;
  }
  .hero-btn {
    background: rgba(255, 255, 255, 0.14);
    border: 2px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  .hero-btn.primary {
    background: #ffffff;
    color: #090a0f;
  }
  .hero-btn.focused {
    transform: scale(1.08);
    border-color: #ffffff;
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 8px 28px var(--accent-glow);
  }

  /* CONTENT ROWS */
  .rows-viewport {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .row-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row-header {
    font-size: 18px;
    font-weight: 700;
    color: #e4e4e7;
    letter-spacing: 0.4px;
  }
  .cards-track {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    padding: 10px 6px 14px 6px;
    scrollbar-width: none;
  }
  .cards-track::-webkit-scrollbar { display: none; }

  /* CARDS */
  .tv-card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #14161f;
    border: 3px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1), border-color 0.22s, box-shadow 0.22s;
  }
  .tv-card.app-card {
    width: 210px;
    height: 125px;
  }
  .tv-card.movie-card {
    width: 240px;
    height: 140px;
  }
  .tv-card.sport-card {
    width: 290px;
    height: 140px;
  }
  .tv-card.photo-card {
    width: 260px;
    height: 150px;
  }
  .card-bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.82;
    transition: opacity 0.25s, transform 0.35s;
  }
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.1) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px;
  }
  .card-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .card-tag.live {
    background: #dc2626;
    border-color: #ef4444;
  }
  .card-title {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
  }
  .card-sub {
    font-size: 12px;
    color: #a1a1aa;
    margin-top: 2px;
  }
  .tv-card.focused {
    transform: scale(1.11) translateY(-4px);
    border-color: #ffffff;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.85), 0 0 22px var(--accent-glow);
    z-index: 5;
  }
  .tv-card.focused .card-bg {
    opacity: 1;
    transform: scale(1.06);
  }

  /* BUILT-IN VIDEO PLAYER MODAL */
  .player-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
    display: none;
    flex-direction: column;
    justify-content: space-between;
  }
  .player-modal.open {
    display: flex;
  }
  .player-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .player-hud {
    position: relative;
    z-index: 210;
    margin-top: auto;
    background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
    padding: 30px 60px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .player-title {
    font-size: 28px;
    font-weight: 800;
  }
  .player-controls {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .player-btn {
    background: rgba(255,255,255,0.16);
    border: 2px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .player-btn.focused {
    background: var(--accent);
    border-color: #fff;
    transform: scale(1.08);
  }

  /* AMBIENT SCREENSAVER (PHOTOGRAPHER ART MODE) */
  .ambient-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 300;
    display: none;
  }
  .ambient-modal.open {
    display: block;
  }
  .ambient-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: kenburns 24s infinite alternate ease-in-out;
  }
  .ambient-info {
    position: absolute;
    bottom: 48px;
    left: 60px;
    background: rgba(10, 12, 18, 0.72);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 18px 28px;
    border-radius: 18px;
    backdrop-filter: blur(16px);
  }
  .ambient-loc { font-size: 24px; font-weight: 800; }
  .ambient-author { font-size: 14px; color: #cbd5e1; margin-top: 4px; }
  @keyframes kenburns {
    0% { transform: scale(1); }
    100% { transform: scale(1.14) translate(-18px, -12px); }
  }
</style>
</head>
