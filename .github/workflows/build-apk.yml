        },
        {
          title: "Mountain Landscapes", sub: "Curated Earth Gallery", tag: "4K ART",
          accent: "#3b82f6", meta: "World Photography Collection",
          desc: "Turn your Mi TV into a living picture frame with curated nature photography.",
          bg: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80",
          actionType: "ambient"
        }
      ]
    }
  ]
};

const AMBIENT_SLIDES = [
  { img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=85", loc: "Yosemite Valley, California", author: "Photo by Bailey Zindel" },
  { img: "https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1920&q=85", loc: "Family Memories Collection", author: "Featured Family Album" },
  { img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=85", loc: "Dolomites Mountain Range, Italy", author: "Photo by Max Rive" },
  { img: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1920&q=85", loc: "Kyoto Temples, Japan", author: "Photo by Su San Lee" }
];

let currentTab = 'home';
let focusZone = 'cards'; // 'nav', 'hero', 'cards', 'player'
let navIdx = 0;
let heroIdx = 0;
let rowIdx = 0;
let colIdx = 0;
let playerIdx = 0;
let activeItem = DATA.home[0].items[0];
let ambientIdx = 0;
let ambientTimer = null;
let idleCounter = 0;

// Update Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

// Launch Android TV App or Fallback
function triggerAction(item, forceStream = false) {
  if (!item) return;
  if (forceStream || item.actionType === 'stream') {
    openCinemaPlayer(item.title, item.streamUrl || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsofSteel.mp4");
    return;
  }
  if (item.actionType === 'ambient') {
    startAmbientMode();
    return;
  }
  if (item.actionType === 'settings') {
    window.location.href = "intent:#Intent;action=android.settings.SETTINGS;end";
    return;
  }
  if (item.actionType === 'app' && item.pkg) {
    // Native Android TV Leanback Intent URI
    const intentUrl = `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LEANBACK_LAUNCHER;package=${item.pkg};S.browser_fallback_url=${encodeURIComponent(item.webUrl)};end`;
    window.location.href = intentUrl;
  }
}

// Render Current Tab Rows
function renderTab(tabKey) {
  currentTab = tabKey;
  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.classList.toggle('active-tab', btn.dataset.tab === tabKey);
  });

  const container = document.getElementById('rows-container');
  container.innerHTML = '';
  const rows = DATA[tabKey] || [];

  rows.forEach((r, rIndex) => {
    const sec = document.createElement('div');
    sec.className = 'row-section';
    sec.innerHTML = `<div class="row-header">${r.rowTitle}</div>`;
    const track = document.createElement('div');
    track.className = 'cards-track';

    r.items.forEach((item, cIndex) => {
      const card = document.createElement('div');
      card.className = `tv-card ${r.cardType}`;
      card.dataset.r = rIndex;
      card.dataset.c = cIndex;
      card.innerHTML = `
        <img class="card-bg" src="${item.bg}" alt="${item.title}">
        <span class="card-tag ${item.tag.includes('LIVE') ? 'live' : ''}">${item.tag}</span>
        <div class="card-overlay">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.sub}</div>
        </div>
      `;
      card.addEventListener('click', () => {
        focusZone = 'cards';
        rowIdx = rIndex;
        colIdx = cIndex;
        applyFocus();
        triggerAction(item, false);
      });
      track.appendChild(card);
    });
    sec.appendChild(track);
    container.appendChild(sec);
  });

  rowIdx = 0;
  colIdx = 0;
  updateHero(rows[0].items[0]);
  applyFocus();
}

// Update Hero Stage & Background Fanart
function updateHero(item) {
  if (!item) return;
  activeItem = item;
  document.documentElement.style.setProperty('--accent', item.accent || '#e50914');
  document.documentElement.style.setProperty('--accent-glow', (item.accent || '#e50914') + '88');
  document.getElementById('fanart-bg').style.backgroundImage = `url('${item.bg}')`;
  document.getElementById('hero-badge').innerText = item.tag || 'FEATURED';
  document.getElementById('hero-meta').innerText = item.meta || '';
  document.getElementById('hero-title').innerText = item.title;
  document.getElementById('hero-desc').innerText = item.desc;

  const primaryBtn = document.getElementById('hero-btn-primary');
  if (item.actionType === 'stream') {
    primaryBtn.innerText = '▶ Play Movie in Theater';
  } else if (item.actionType === 'ambient') {
    primaryBtn.innerText = '🖼 Start Photo Frame';
  } else {
    primaryBtn.innerText = `▶ Open ${item.title}`;
  }
}

// Highlight Focused Element
function applyFocus() {
  document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));

  if (focusZone === 'nav') {
    const navItems = [...document.querySelectorAll('.nav-tab'), document.getElementById('btn-ambient')];
    const target = navItems[navIdx];
    if (target) {
      target.classList.add('focused');
      if (target.dataset.tab && target.dataset.tab !== currentTab) {
        renderTab(target.dataset.tab);
        focusZone = 'nav';
        target.classList.add('focused');
      }
    }
  } else if (focusZone === 'hero') {
    const btns = [document.getElementById('hero-btn-primary'), document.getElementById('hero-btn-trailer')];
    if (btns[heroIdx]) btns[heroIdx].classList.add('focused');
  } else if (focusZone === 'cards') {
    const rows = DATA[currentTab];
    if (!rows || !rows[rowIdx]) return;
    const item = rows[rowIdx].items[colIdx];
    updateHero(item);
    const cardEl = document.querySelector(`.tv-card[data-r="${rowIdx}"][data-c="${colIdx}"]`);
    if (cardEl) {
      cardEl.classList.add('focused');
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  } else if (focusZone === 'player') {
    const pBtns = document.querySelectorAll('.player-btn');
    if (pBtns[playerIdx]) pBtns[playerIdx].classList.add('focused');
  }
}

// Built-in Video Player Functions
const playerModal = document.getElementById('player-modal');
const videoEl = document.getElementById('cinema-video');

function openCinemaPlayer(title, url) {
  document.getElementById('player-title').innerText = title;
  videoEl.src = url;
  playerModal.classList.add('open');
  videoEl.play().catch(() => {});
  focusZone = 'player';
  playerIdx = 0;
  applyFocus();
}

function closeCinemaPlayer() {
  videoEl.pause();
  videoEl.src = "";
  playerModal.classList.remove('open');
  focusZone = 'cards';
  applyFocus();
}

document.getElementById('p-toggle').onclick = () => {
  if (videoEl.paused) { videoEl.play(); document.getElementById('p-toggle').innerText = '⏸ Pause'; }
  else { videoEl.pause(); document.getElementById('p-toggle').innerText = '▶ Play'; }
};
document.getElementById('p-rew').onclick = () => { videoEl.currentTime = Math.max(0, videoEl.currentTime - 10); };
document.getElementById('p-fwd').onclick = () => { videoEl.currentTime += 10; };
document.getElementById('p-close').onclick = closeCinemaPlayer;

// Hero Button Clicks
document.getElementById('hero-btn-primary').onclick = () => triggerAction(activeItem, false);
document.getElementById('hero-btn-trailer').onclick = () => triggerAction(activeItem, true);
document.getElementById('btn-ambient').onclick = startAmbientMode;

// Nav Clicks
document.querySelectorAll('.nav-tab').forEach((btn, idx) => {
  btn.addEventListener('click', () => {
    navIdx = idx;
    renderTab(btn.dataset.tab);
  });
});

// Ambient Art Mode
const ambientModal = document.getElementById('ambient-modal');
function updateAmbientSlide() {
  const s = AMBIENT_SLIDES[ambientIdx % AMBIENT_SLIDES.length];
  document.getElementById('ambient-img').src = s.img;
  document.getElementById('ambient-loc').innerText = s.loc;
  document.getElementById('ambient-author').innerText = s.author + " • Press any key to wake";
}
function startAmbientMode() {
  ambientIdx = 0;
  updateAmbientSlide();
  ambientModal.classList.add('open');
  clearInterval(ambientTimer);
  ambientTimer = setInterval(() => {
    ambientIdx++;
    updateAmbientSlide();
  }, 10000);
}
function stopAmbientMode() {
  ambientModal.classList.remove('open');
  clearInterval(ambientTimer);
}

// D-Pad Remote Key Handler
window.addEventListener('keydown', (e) => {
  idleCounter = 0;
  if (ambientModal.classList.contains('open')) {
    e.preventDefault();
    stopAmbientMode();
    return;
  }

  const key = e.key;
  if (focusZone === 'player') {
    const pBtns = document.querySelectorAll('.player-btn');
    if (key === 'ArrowRight') { playerIdx = Math.min(pBtns.length - 1, playerIdx + 1); applyFocus(); }
    else if (key === 'ArrowLeft') { playerIdx = Math.max(0, playerIdx - 1); applyFocus(); }
    else if (key === 'Enter') { pBtns[playerIdx].click(); }
    else if (key === 'Escape' || key === 'Backspace') { closeCinemaPlayer(); }
    return;
  }

  const rows = DATA[currentTab];
  if (key === 'ArrowUp') {
    e.preventDefault();
    if (focusZone === 'cards') {
      if (rowIdx > 0) {
        rowIdx--;
        colIdx = Math.min(colIdx, rows[rowIdx].items.length - 1);
      } else {
        focusZone = 'hero';
        heroIdx = 0;
      }
    } else if (focusZone === 'hero') {
      focusZone = 'nav';
    }
    applyFocus();
  } else if (key === 'ArrowDown') {
    e.preventDefault();
    if (focusZone === 'nav') {
      focusZone = 'hero';
      heroIdx = 0;
    } else if (focusZone === 'hero') {
      focusZone = 'cards';
      rowIdx = 0;
      colIdx = 0;
    } else if (focusZone === 'cards' && rowIdx < rows.length - 1) {
      rowIdx++;
      colIdx = Math.min(colIdx, rows[rowIdx].items.length - 1);
    }
    applyFocus();
  } else if (key === 'ArrowRight') {
    e.preventDefault();
    if (focusZone === 'nav') {
      navIdx = Math.min(4, navIdx + 1);
    } else if (focusZone === 'hero') {
      heroIdx = Math.min(1, heroIdx + 1);
    } else if (focusZone === 'cards') {
      colIdx = Math.min(rows[rowIdx].items.length - 1, colIdx + 1);
    }
    applyFocus();
  } else if (key === 'ArrowLeft') {
    e.preventDefault();
    if (focusZone === 'nav') {
      navIdx = Math.max(0, navIdx - 1);
    } else if (focusZone === 'hero') {
      heroIdx = Math.max(0, heroIdx - 1);
    } else if (focusZone === 'cards') {
      colIdx = Math.max(0, colIdx - 1);
    }
    applyFocus();
  } else if (key === 'Enter') {
    e.preventDefault();
    if (focusZone === 'nav') {
      const navItems = [...document.querySelectorAll('.nav-tab'), document.getElementById('btn-ambient')];
      navItems[navIdx].click();
    } else if (focusZone === 'hero') {
      const btns = [document.getElementById('hero-btn-primary'), document.getElementById('hero-btn-trailer')];
      btns[heroIdx].click();
    } else if (focusZone === 'cards') {
      triggerAction(rows[rowIdx].items[colIdx], false);
    }
  }
});

// Idle Auto-Screensaver (60s)
setInterval(() => {
  idleCounter++;
  if (idleCounter >= 60 && !playerModal.classList.contains('open') && !ambientModal.classList.contains('open')) {
    startAmbientMode();
  }
}, 1000);

// Initialize
renderTab('home');
</script>
</body>
</html>
