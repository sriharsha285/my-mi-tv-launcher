        <button class="player-btn" id="p-close">✖ Exit Player</button>
      </div>
    </div>
  </div>

  <!-- AMBIENT PHOTOGRAPHER SCREENSAVER -->
  <div class="ambient-modal" id="ambient-modal">
    <img class="ambient-img" id="ambient-img" src="" alt="Ambient Art">
    <div class="ambient-info">
      <div class="ambient-loc" id="ambient-loc">Dolomites, Italy</div>
      <div class="ambient-author" id="ambient-author">Shot by Max Rive • Press any key to wake</div>
    </div>
  </div>

